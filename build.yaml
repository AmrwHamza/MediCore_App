targets:
  $default:
    builders:
      freezed:
        enabled: true
        generate_for:
          - lib/features/**/*_state.dart
          - lib/features/**/*_cubit.dart
          - lib/features/**/*_model.dart
          - lib/features/**/domain/entities/*.dart
          - lib/features/**/data/models/*.dart
          - lib/core/**/*.dart
        options:
          freezed:
            strict_checks: true