name: medicore_app
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  cached_network_image:
  dartz:
  dio:
  dots_indicator:
  easy_localization:
  equatable:
  firebase_core:
  firebase_messaging:
  flutter:
    sdk: flutter
  flutter_animate:
  flutter_bloc:
  flutter_datetime_picker_plus:
  flutter_rating_bar:
  flutter_spinkit:
  flutter_svg:
  font_awesome_flutter: 11.0.0
  get:
  get_it:
  go_router:
  hive:
  hive_flutter:
  image_cropper:
  image_picker:
  intl_phone_field:
  logger:
  modal_progress_hud_nsn:
  percent_indicator:
  pretty_dio_logger: ^1.4.0
  provider:
  shared_preferences:
  shimmer:
  table_calendar:
  timeline_tile:

dev_dependencies:
  build_runner:
  flutter_launcher_icons:

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Icon.jpg"
  min_sdk_android: 21
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/translations/

  fonts:
    - family: RobotoSlab
      fonts:
        - asset: fonts/RobotoSlab-Thin.ttf
          weight: 100
        - asset: fonts/RobotoSlab-Light.ttf
          weight: 300
        - asset: fonts/RobotoSlab-Regular.ttf
          weight: 400
        - asset: fonts/RobotoSlab-Medium.ttf
          weight: 500
        - asset: fonts/RobotoSlab-SemiBold.ttf
          weight: 600
        - asset: fonts/RobotoSlab-Bold.ttf
          weight: 700

    - family: Tajawal
      fonts:
        - asset: fonts/Tajawal-Light.ttf
          weight: 300
        - asset: fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: fonts/Tajawal-Bold.ttf
          weight: 700

flutter_assets:
  assets_path: assets/images/
  output_path: lib/core/utils
  filename: app_images.dart
  field_prefix: null
flutter_intl:
  enabled: true
